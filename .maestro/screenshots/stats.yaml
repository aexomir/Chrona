# Captures the Stats tab for release screenshots.
# Run: maestro test .maestro/screenshots/stats.yaml --test-output-dir <dir>

appId: com.aexomir.Chrona

---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "TODAY"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 4000
- openLink: "chrona://stats"
- extendedWaitUntil:
    visible:
      text: "Week"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: stats
