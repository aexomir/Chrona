name: FocusHelper
options:
  bundleIdPrefix: com.focus
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  FocusHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        # Menu bar only — no Dock icon
        LSUIElement: true
        # Required for AXUIElement window title capture (embedded source)
        NSAccessibilityUsageDescription: "FocusHelper reads the active window title to record which task you are working on."
        # Allow outbound connections to an external ActivityWatch server (external source mode)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: FocusHelper
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
